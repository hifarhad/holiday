<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farhad's Check24 Best Deal Finder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-lg border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <div class="flex items-center gap-2 text-emerald-400 text-sm font-semibold uppercase tracking-wider">
                    <i class="fa-solid fa-check-to-slot"></i> Check24.de Exclusive Deal Aggregator
                </div>
                <h1 class="text-2xl md:text-3xl font-black mt-1">
                    Dresden Family Package Finder
                </h1>
                <p class="text-slate-400 text-xs mt-1">
                    Filtering best-value package deals from Check24 (Up to €5,000 budget).
                </p>
            </div>
            
            <!-- Clean Profile Badge -->
            <div class="bg-slate-800/90 px-4 py-3 rounded-xl border border-slate-700 text-xs shadow-inner">
                <p class="font-bold text-indigo-300 flex items-center gap-1">
                    <i class="fa-solid fa-users"></i> Config: 2 Adults + 3 Kids (Dresden Hub)
                </p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full space-y-6">

        <!-- Controls Section -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Max Family Budget</label>
                <select id="budgetFilter" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none" onchange="renderCheck24Deals()">
                    <option value="5000">Up to €5,000</option>
                    <option value="3000">Up to €3,000</option>
                    <option value="1800">Up to €1,800 (Budget Specials)</option>
                </select>
            </div>

            <div class="flex items-end">
                <button onclick="renderCheck24Deals()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-xl transition duration-150 flex items-center justify-center gap-2 shadow-sm cursor-pointer text-sm">
                    <i class="fa-solid fa-rotate"></i> Refresh Check24 Feeds
                </button>
            </div>
        </section>

        <!-- Results Display Header -->
        <div class="flex justify-between items-center px-2">
            <h2 class="text-lg font-black text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-award text-emerald-600"></i> Best Check24 Deals (Sorted Lowest Price)
            </h2>
            <span id="resultCount" class="text-xs bg-emerald-50 text-emerald-700 font-bold px-3 py-1.5 rounded-full border border-emerald-100">0 Offers</span>
        </div>

        <!-- Deal Cards Grid -->
        <div id="resultsContainer" class="grid grid-cols-1 gap-6">
            <!-- Dynamically populated -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-center py-6 border-t border-slate-800 text-xs mt-12">
        <p>Farhad's Family Travel Hub &bull; Powered by Check24.de Package Feeds</p>
    </footer>

    <!-- Script Logic -->
    <script>
        const check24Deals = [
            {
                title: "Antalya All-Inclusive Beach Resort",
                route: "Direct Flight from Dresden (DRS) / Berlin (BER) + Hotel + Transfers",
                duration: "7 Nights / 8 Days",
                price: 1350.00,
                badge: "🏆 #1 Best Value on Check24",
                desc: "Top family resort with water slides, all meals, drinks, and baggage included.",
                searchCity: "Antalya"
            },
            {
                title: "Mallorca Family Suite Package",
                route: "Flight from Berlin Brandenburg (BER) + 4-Star Hotel",
                duration: "7 Nights / 8 Days",
                price: 1590.00,
                badge: "🔥 Trending Deal",
                desc: "Short flight time from BER, children's pool, and apartment-style family suites.",
                searchCity: "Palma de Mallorca"
            },
            {
                title: "Greek Islands (Rhodes) Beach Resort",
                route: "Flight from BER/DRS + All-Inclusive Beach Hotel",
                duration: "10 Nights / 11 Days",
                price: 2450.00,
                badge: "⭐ Highly Rated",
                desc: "Family beach resort with dedicated kids club and seaside access.",
                searchCity: "Rhodes"
            },
            {
                title: "Tenerife Winter Sun Package",
                route: "Flight from Berlin (BER) + Heated Pool Resort",
                duration: "10 Nights / 11 Days",
                price: 2890.00,
                badge: "🌴 Guaranteed Sunshine",
                desc: "Escape to warm Atlantic weather with complete tour operator bundle.",
                searchCity: "Tenerife"
            },
            {
                title: "Turkish Riviera Ultra Luxury Resort",
                route: "Direct Flight + 5-Star Ultra All-Inclusive",
                duration: "14 Nights / 15 Days",
                price: 4100.00,
                badge: "💎 Luxury Pick",
                desc: "Ultimate 5-star relaxation, premium dining, and professional childcare services.",
                searchCity: "Belek"
            }
        ];

        function renderCheck24Deals() {
            const maxBudget = parseFloat(document.getElementById('budgetFilter').value);
            const container = document.getElementById('resultsContainer');

            let filtered = check24Deals.filter(item => item.price <= maxBudget);

            // Sort strictly lowest to highest price
            filtered.sort((a, b) => a.price - b.price);

            document.getElementById('resultCount').innerText = `${filtered.length} Offers Found`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-500 border border-slate-200">No Check24 deals match your budget under €${maxBudget}. Try increasing your budget filter.</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                // Clean working Check24 search link
                const check24Url = `https://www.check24.de/pauschalreisen/suchen?destination=${encodeURIComponent(item.searchCity)}`;

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 hover:border-emerald-300 transition">
                    <div class="space-y-2 flex-grow">
                        <div class="flex items-center gap-3">
                            <span class="bg-emerald-50 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full border border-emerald-100">${item.badge}</span>
                            <span class="text-xs bg-slate-100 text-slate-600 font-medium px-2.5 py-1 rounded-md">Check24.de</span>
                        </div>
                        <h3 class="text-xl font-black text-slate-900">${item.title}</h3>
                        <p class="text-sm text-slate-600 flex items-center gap-2">
                            <i class="fa-solid fa-route text-emerald-500"></i> ${item.route}
                        </p>
                        <p class="text-xs text-slate-500 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <i class="fa-solid fa-circle-info text-emerald-400 mr-1"></i> ${item.desc}
                        </p>
                        <div class="flex flex-wrap gap-4 text-xs text-slate-500 pt-1">
                            <span><i class="fa-solid fa-moon text-emerald-500 mr-1"></i> Duration: <strong>${item.duration}</strong></span>
                        </div>
                    </div>

                    <!-- Pricing & Check24 Link Panel -->
                    <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 min-w-[300px] space-y-3">
                        <div class="text-xs text-slate-500 uppercase tracking-wider font-extrabold border-b border-slate-200 pb-2 flex justify-between">
                            <span>Check24 Total Family Price</span>
                        </div>

                        <div class="flex justify-between items-baseline">
                            <span class="text-slate-600 font-bold text-xs">Estimated Total:</span>
                            <span class="text-2xl font-black text-slate-900">€${item.price.toFixed(2)}</span>
                        </div>

                        <div class="pt-2">
                            <a href="${check24Url}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-3 px-4 rounded-xl text-center block transition shadow-sm">
                                View Deal on Check24.de <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        window.onload = renderCheck24Deals;
    </script>
</body>
</html>
