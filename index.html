<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farhad's Live Global Travel Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-lg border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <div class="flex items-center gap-2 text-emerald-400 text-sm font-semibold uppercase tracking-wider">
                    <i class="fa-solid fa-earth-americas"></i> Live Worldwide Search Constructor
                </div>
                <h1 class="text-2xl md:text-3xl font-black mt-1">
                    Global Family Travel Hub
                </h1>
                <p class="text-slate-400 text-xs mt-1">
                    No price limits. Search any country or worldwide destination live.
                </p>
            </div>
            
            <div class="bg-slate-800/90 px-4 py-3 rounded-xl border border-slate-700 text-xs shadow-inner">
                <p class="font-bold text-indigo-300 flex items-center gap-1">
                    <i class="fa-solid fa-users"></i> Config: 2 Adults + 3 Kids (Dresden Hub)
                </p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full space-y-6">

        <!-- Universal Search Box -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Type Any Country or City Worldwide</label>
                <input type="text" id="globalSearchInput" value="Thailand" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="e.g. Japan, Greece, Maldives, USA">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Departure Hub</label>
                <select id="hubInput" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <option value="DRS">Dresden Airport (DRS)</option>
                    <option value="BER">Berlin Brandenburg (BER)</option>
                    <option value="PRG">Prague (PRG)</option>
                </select>
            </div>

            <div>
                <button onclick="launchGlobalSearch()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3.5 rounded-xl transition duration-150 flex items-center justify-center gap-2 shadow-sm cursor-pointer text-sm">
                    <i class="fa-solid fa-magnifying-glass"></i> Search Live Inventories
                </button>
            </div>
        </section>

        <!-- Popular Worldwide Quick Shortcuts -->
        <div class="space-y-4">
            <h2 class="text-lg font-black text-slate-900 flex items-center gap-2 px-2">
                <i class="fa-solid fa-fire text-amber-500"></i> Popular Worldwide Destinations (Click to Search Live)
            </h2>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="searchQuick('Japan')" class="bg-white p-4 rounded-xl border border-slate-200 hover:border-emerald-400 text-left transition shadow-sm cursor-pointer">
                    <div class="font-bold text-slate-900">🇯🇵 Japan</div>
                    <div class="text-xs text-slate-500 mt-0.5">Tokyo, Kyoto & Culture</div>
                </button>
                <button onclick="searchQuick('Greece')" class="bg-white p-4 rounded-xl border border-slate-200 hover:border-emerald-400 text-left transition shadow-sm cursor-pointer">
                    <div class="font-bold text-slate-900">🇬🇷 Greece</div>
                    <div class="text-xs text-slate-500 mt-0.5">Islands & Resorts</div>
                </button>
                <button onclick="searchQuick('Thailand')" class="bg-white p-4 rounded-xl border border-slate-200 hover:border-emerald-400 text-left transition shadow-sm cursor-pointer">
                    <div class="font-bold text-slate-900">🇹🇭 Thailand</div>
                    <div class="text-xs text-slate-500 mt-0.5">Phuket, Bangkok & Beaches</div>
                </button>
                <button onclick="searchQuick('United States')" class="bg-white p-4 rounded-xl border border-slate-200 hover:border-emerald-400 text-left transition shadow-sm cursor-pointer">
                    <div class="font-bold text-slate-900">🇺🇸 United States</div>
                    <div class="text-xs text-slate-500 mt-0.5">Florida & California</div>
                </button>
                <button onclick="searchQuick('Spain')" class="bg-white p-4 rounded-xl border border-slate-200 hover:border-emerald-400 text-left transition shadow-sm cursor-pointer">
                    <div class="font-bold text-slate-900">🇪🇸 Spain</div>
                    <div class="text-xs text-slate-500 mt-0.5">Mallorca, Tenerife & Costa</div>
                </button>
                <button onclick="searchQuick('Turkey')" class="bg-white p-4 rounded-xl border border-slate-200 hover:border-emerald-400 text-left transition shadow-sm cursor-pointer">
                    <div class="font-bold text-slate-900">🇹🇷 Turkey</div>
                    <div class="text-xs text-slate-500 mt-0.5">Antalya & Turkish Riviera</div>
                </button>
                <button onclick="searchQuick('Maldives')" class="bg-white p-4 rounded-xl border border-slate-200 hover:border-emerald-400 text-left transition shadow-sm cursor-pointer">
                    <div class="font-bold text-slate-900">🇲🇻 Maldives</div>
                    <div class="text-xs text-slate-500 mt-0.5">Overwater Bungalows</div>
                </button>
                <button onclick="searchQuick('Egypt')" class="bg-white p-4 rounded-xl border border-slate-200 hover:border-emerald-400 text-left transition shadow-sm cursor-pointer">
                    <div class="font-bold text-slate-900">🇪🇬 Egypt</div>
                    <div class="text-xs text-slate-500 mt-0.5">Hurghada & Sharm el-Sheikh</div>
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-center py-6 border-t border-slate-800 text-xs mt-12">
        <p>Farhad's Global Travel Hub &bull; Direct Live Search Constructor</p>
    </footer>

    <!-- Script Logic -->
    <script>
        function launchGlobalSearch() {
            const query = document.getElementById('globalSearchInput').value.trim() || "Thailand";
            executeSearch(query);
        }

        function searchQuick(countryName) {
            document.getElementById('globalSearchInput').value = countryName;
            executeSearch(countryName);
        }

        function executeSearch(destination) {
            // Opens live search pages directly on major platforms with zero price caps
            const check24Url = `https://www.check24.de/pauschalreisen/suchen?destination=${encodeURIComponent(destination)}`;
            const abInDenUrlaubUrl = `https://www.ab-in-den-urlaub.de/pauschalreise/suchen?destination=${encodeURIComponent(destination)}`;
            const skyscannerUrl = `https://www.skyscanner.de`;

            window.open(check24Url, '_blank');
            window.open(abInDenUrlaubUrl, '_blank');
            window.open(skyscannerUrl, '_blank');
        }
    </script>
</body>
</html>
